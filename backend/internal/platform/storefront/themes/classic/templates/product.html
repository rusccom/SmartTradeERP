{{define "content"}}
<article class="product">
<div class="product-gallery">
{{range .Images}}<img class="product-image" src="{{.}}" alt="" loading="lazy">{{else}}<div class="product-noimg"></div>{{end}}
</div>
<div class="product-info">
<h1 class="product-name">{{.Name}}</h1>
{{if .HasPrice}}<div class="product-price">{{.Price.Display}}</div>{{end}}
{{if .Description}}<p class="product-desc">{{.Description}}</p>{{end}}
{{template "variant-picker" .}}
{{with .Selected}}<button class="add-btn" type="button" data-sf-add="{{.VariantID}}" data-added="Added ✓" {{if not .Purchasable}}disabled{{end}}>Add to cart</button>{{end}}
</div>
</article>
{{end}}
