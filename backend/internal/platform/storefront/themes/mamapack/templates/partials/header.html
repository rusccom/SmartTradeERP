{{define "header"}}
{{if .Preview}}<div class="preview-bar">Podgląd sklepu · Zamówienia próbne</div>{{end}}
<header class="header page-width">
  <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="shop-nav" hidden>
    <span class="menu-icon" aria-hidden="true"></span><span class="sr-only">Menu sklepu</span>
  </button>
  <a class="logo" href="/" aria-label="MamaPack — strona główna">
    {{if .Brand.LogoURL}}<img src="{{.Brand.LogoURL}}" alt="{{.Brand.TenantName}}">
    {{else}}<img src="/_assets/themes/mamapack/logo.webp" alt="MamaPack" width="450" height="102">{{end}}
  </a>
  <nav id="shop-nav" class="shop-nav" aria-label="Sklep">
    <a href="/">Home</a>
    {{if .HasPlugin "smartbundle"}}<a href="/pages/zlozsam">Złóż to sama</a><a href="/pages/gotowe-torby">Gotowe torby</a>{{end}}
    <a href="/products">Produkty</a>
  </nav>
  <a class="bag-link" href="/cart">
    <svg width="24" height="24" viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M3.8 8.5h16.4l1 14H2.8l1-14Z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/>
    </svg>
    <span class="sr-only">Koszyk</span><span class="bag-count" data-sf-cart-count hidden></span>
    <span class="bag-total" data-cart-total></span>
  </a>
</header>
{{end}}
