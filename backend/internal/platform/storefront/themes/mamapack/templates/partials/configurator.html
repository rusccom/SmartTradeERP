{{define "configurator"}}<form class="kit-form" data-kit="{{.VariantID}}"><h2>Dobierz skład torby</h2>
{{if ne .Name "Default"}}<p>{{.Name}}</p>{{end}}
{{range .Slots}}<label><span>{{.Name}} <small>× {{.Qty}}</small></span>
<select data-slot="{{.Key}}" aria-label="{{.Name}}" required>{{range .Options}}<option value="{{.ID}}">{{if eq .Name "Default"}}Podstawowy{{else}}{{.Name}}{{end}}</option>{{end}}</select></label>{{end}}
<div class="kit-total"><span>Cena zestawu</span><strong data-kit-price>{{if .HasPrice}}{{.Price.Display}}{{else}}—{{end}}</strong></div>
<button class="button" type="submit" disabled data-added="Dodano ✓">Dodaj zestaw do koszyka</button><p role="status" data-kit-status></p></form>{{end}}
