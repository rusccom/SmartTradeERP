{{define "layout"}}<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{template "seo-head" .Layout}}
  <link rel="icon" href="/_assets/themes/mamapack/logo.webp">
  <link rel="stylesheet" href="/_assets/themes/mamapack/theme.css?v={{.Layout.Theme.AssetVersion}}">
  {{block "page-assets" .}}<link rel="stylesheet" href="/_assets/themes/mamapack/catalog.css">{{end}}
  <script type="module" src="/_assets/storefront.js?v=2"></script>
  <script type="module" src="/_assets/themes/mamapack/navigation.js"></script>
  {{if .Layout.HasPlugin "smartbundle"}}
    <script type="module" src="/_assets/plugins/smartbundle/configurator.js"></script>
    <script type="module" src="/_assets/themes/mamapack/shop.js"></script>
  {{end}}
</head>
<body>
  <a class="skip" href="#main">Przejdź do treści</a>
  {{template "header" .Layout}}
  <main id="main" class="{{block "page-width" .}}page-width{{end}}">{{template "content" .}}</main>
  <footer class="footer page-width">
    <a href="/">MamaPack</a><span>Wyprawka dla mamy i dziecka</span><a href="/cart">Koszyk</a>
  </footer>
</body>
</html>{{end}}
