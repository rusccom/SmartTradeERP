{{define "variant-picker"}}{{if gt (len .Variants) 1}}<nav class="anchors variant-options" data-variant-picker aria-label="{{if eq .Layout.Language "pl"}}Wariant produktu{{else}}Product variant{{end}}">
{{range .Variants}}<a href="?variant={{.VariantID}}" {{if eq .VariantID $.Selected.VariantID}}aria-current="true"{{end}}>{{.Name}}</a>{{end}}</nav>
<p data-variant-error role="alert" hidden>{{if eq .Layout.Language "pl"}}Nie udało się wczytać wariantu. Spróbuj ponownie.{{else}}Could not load this variant. Please try again.{{end}}</p>
<script type="module" src="/_assets/variant-picker.js"></script>{{end}}{{end}}
